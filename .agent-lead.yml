# Who leads what, BY PATH.
#
# This repository has CO-LEADS, not a single lead. See docs/03-repo-lead.md.
#
# The original single-lead-per-repo design does not fit here and would be wrong:
# three domains with different constraint levels, three agents, one repo. Scoping
# the lead to a path is what makes co-leadership work without a mutex.
#
# Reading it: find the longest path prefix that matches what you are about to
# change. That path's lead owns it. `/` is co-owned and changes there are proposed
# by PR to all three, never landed unilaterally.

leads:
  - path: /
    lead: co-owned
    agents: [ria-lead, business-lead, personal-lead]
    note: >-
      Shared, domain-neutral practices (docs/). These are the failure modes that
      transfer completely between domains. A change here affects all three leads,
      so it goes through a PR the others can see — not a direct commit.

  - path: /RIA
    lead: ria-lead
    domain: SEC-registered investment adviser
    constraints: regulatory + business
    note: >-
      The outermost constraint tier. ria-lead is the only agent that operates
      inside it. Others contribute by issue or PR; ria-lead decides whether a
      practice clears the regulatory bar, and that decision is not delegable.

  - path: /Business
    lead: business-lead
    domain: commercial work, proprietary and confidential data
    constraints: business
    note: >-
      Also usable for the single-operator LLC case, where the entity is legally a
      business and practically personal.

  - path: /Personal
    lead: personal-lead
    domain: individual work
    constraints: none external
    note: >-
      The owner has referred to this tier as both "Personal" and "Individual".
      Read as the same tier unless stated otherwise; if a fourth level is wanted,
      that is the owner's call, not a lead's.

  - path: /tools
    lead: co-owned
    agents: [ria-lead, business-lead, personal-lead]
    note: >-
      Open-source tools, each carrying how far it was actually checked: RUN,
      VERIFIED, READ or UNEVALUATED. Domain-neutral — the constraint tiers govern
      what you may point a tool AT, not whether it works. A credit is not an
      endorsement; entries that blur the two are how an untested tool reaches a
      regulated pipeline.

  - path: /research
    lead: co-owned
    agents: [ria-lead, business-lead, personal-lead]
    note: >-
      Sources behind the practices, with whether anyone read them. UNREAD entries
      are kept deliberately, so a practice resting on an unread source is visible
      rather than implied.

# Cross-domain traffic
#
# Constraints NEST: Personal ⊂ Business ⊂ RIA. So a practice adopted at an inner
# tier is usually adoptable outward; the reverse is often over-commitment —
# taking on a regulated tier's machinery without the obligation that justifies it.
#
# Practices travel between domains. The material they operated on does not.

